<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juegos | Hakinov1</title>
    <link rel="stylesheet" href="../herramientas/Juegos/style.css">
</head>
<body>
    <video class="background-video" autoplay muted loop playsinline poster="../Resorce/img/fondo.jpeg" aria-hidden="true">
        <source src="../Resorce/img/Videos/14668-258508783_small.mp4" type="video/mp4">
    </video>

    <header class="site-header">
        <a class="brand" href="../index.html">HAKINOV1</a>
        <nav aria-label="Navegación principal">
            <a class="active" href="JuegosPages.html">Juegos</a>
            <a href="Clients.html">Clientes</a>
            <a href="https://discord.gg/kkMNYmku6u" target="_blank" rel="noreferrer">Discord</a>
        </nav>
    </header>

    <main class="page-shell">
        <section class="intro">
            <span class="eyebrow">Biblioteca</span>
            <h1>Juegos</h1>
            <p>Descubre los títulos disponibles en Hakinov1.</p>
        </section>

        <section class="games-search" aria-label="Buscar juegos publicados">
            <label for="gameSearch">Buscar juegos publicados</label>
            <input type="search" id="gameSearch" placeholder="Escribe el nombre de un juego..." autocomplete="off">
        </section>

        <section id="gamesEmpty" class="empty-state" aria-live="polite">
            <div class="empty-art">
                <img class="png-cover" src="../Resorce/img/Gemini_Generated_Image_y2dolry2dolry2do-removebg-preview.png" alt="Ilustración de juegos">
            </div>
            <div>
                <span class="status">Próximamente</span>
                <h2>La biblioteca está preparando su primera partida</h2>
                <p>Aquí aparecerán tus juegos cuando se publiquen.</p>
                <a class="text-link" href="../index.html">Volver al inicio <span aria-hidden="true">-></span></a>
            </div>
        </section>

        <section id="gamesGrid" class="games-grid" aria-label="Juegos disponibles"></section>
        <p id="gamesNoResults" class="games-no-results" hidden>No hay juegos que coincidan con tu búsqueda.</p>
        <nav id="gamesPagination" class="pagination" aria-label="Paginación de juegos"></nav>
    </main>

    <script src="../datos/catalogo.js"></script>
    <script src="../herramientas/Juegos/scripts.js"></script>
</body>
</html>
